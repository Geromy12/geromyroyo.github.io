<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My GitHub Projects</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            padding:30px;
        }

        h1{
            text-align:center;
        }

        .repo{
            background:white;
            padding:15px;
            margin:10px 0;
            border-radius:10px;
            box-shadow:0 0 5px rgba(0,0,0,0.2);
        }

        a{
            text-decoration:none;
            font-size:20px;
            color:#0366d6;
        }
    </style>
</head>

<body>

<h1>My GitHub Repositories</h1>

<div id="repos"></div>

<script>

fetch("https://api.github.com/users/geromyroyo/repos")

.then(response => response.json())

.then(repos => {

    const container = document.getElementById("repos");

    repos.forEach(repo => {

        const card = document.createElement("div");

        card.className = "repo";

        card.innerHTML = `
            <a href="${repo.html_url}" target="_blank">
                ${repo.name}
            </a>

            <p>
                ${repo.description || "No description available"}
            </p>
        `;

        container.appendChild(card);
    });

});

</script>

</body>
</html>
